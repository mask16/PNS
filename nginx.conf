# Nginx 리버스 프록시 설정 파일
# 웰딩 장비 옵션 시스템 (PNS) - pnsoptions.com

# HTTP 서버 설정 (포트 80)
server {
    listen 80;
    server_name pnsoptions.com www.pnsoptions.com;

    # 로그 파일 경로
    access_log logs/pns_access.log;
    error_log logs/pns_error.log;

    # 클라이언트 최대 요청 크기 (엑셀 파일 업로드 등을 위해)
    client_max_body_size 50M;

    # 정적 파일 직접 서빙 (선택사항 - 성능 향상)
    location /static/ {
        alias D:/Warehouse/wwwroot/pns/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 모든 요청을 Flask 애플리케이션으로 프록시
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 지원 (필요한 경우)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 타임아웃 설정 (엑셀 다운로드 등을 위해 증가)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

