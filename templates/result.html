{% extends "base.html" %}

{% block title %}결과 - 웰딩 장비 옵션 시스템{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2>
            <i class="fas fa-check-circle me-2"></i>
            처리 결과
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="alert alert-info">
            <h6><i class="fas fa-info-circle me-2"></i>처리 완료</h6>
            <p class="mb-0">요청하신 작업이 완료되었습니다.</p>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-list me-2"></i>
                    다음 단계
                </h5>
            </div>
            <div class="card-body">
                <ul class="list-unstyled">
                    <li class="mb-2">
                        <a href="{{ url_for('select_options') }}" class="btn btn-primary btn-sm">
                            <i class="fas fa-plus me-1"></i>새로운 옵션 선택
                        </a>
                    </li>
                    <li class="mb-2">
                        <a href="{{ url_for('lookup') }}" class="btn btn-success btn-sm">
                            <i class="fas fa-search me-1"></i>코드 조회
                        </a>
                    </li>
                    <li>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm">
                            <i class="fas fa-home me-1"></i>홈으로 돌아가기
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    
    <div class="col-md-6">
        <div class="card">
            <div class="card-header bg-burgundy">
                <h5 class="mb-0">
                    <i class="fas fa-info-circle me-2"></i>
                    시스템 정보
                </h5>
            </div>
            <div class="card-body">
                <p class="text-muted small">
                    웰딩 장비 옵션 시스템은 11개 카테고리의 옵션을 선택하여 
                    고유한 코드를 생성하고 Excel 파일로 내보내는 시스템입니다.
                </p>
                <hr>
                <div class="row text-center">
                    <div class="col-4">
                        <div class="text-primary">
                            <i class="fas fa-database fa-2x"></i>
                            <div class="small">데이터베이스</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="text-success">
                            <i class="fas fa-file-excel fa-2x"></i>
                            <div class="small">Excel 출력</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="text-info">
                            <i class="fas fa-barcode fa-2x"></i>
                            <div class="small">코드 생성</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
