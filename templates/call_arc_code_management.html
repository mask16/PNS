{% block title %}콜아크코드관리 - 웰딩 장비 옵션 시스템{% endblock %}

<style>
    body {
        overflow-x: hidden;
    }
    .call-arc-page {
        width: 100vw;
        max-width: 100vw;
        margin-left: calc(50% - 50vw);
        padding: 0.4rem 0.6rem 0.8rem;
        box-sizing: border-box;
    }

        background: #fff;
        overflow: hidden;
    }
    .call-arc-sheet__toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
        padding: 0.55rem 0.85rem;
        background: #a3475c;
        border-bottom: 1px solid #8a3a4d;
    }
    .call-arc-sheet__title {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        min-width: 0;
    }
    .call-arc-sheet__toolbar h5 {
        color: #fff;
        font-weight: 600;
        margin: 0;
        white-space: nowrap;
    }
    .call-arc-tabs {
        display: flex;
        align-items: center;
        gap: 0.3rem;
    }
    .call-arc-tabs button {
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 0.3rem;
        padding: 0.12rem 0.55rem;
        font-size: 0.82rem;
        font-weight: 700;
        line-height: 1.4;
        min-width: 2.2rem;
    }
    .call-arc-tabs button:hover {
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
    }
    .call-arc-tabs button.is-active {
        background: #fff;
        color: #800020;
        border-color: #fff;
    }
    .call-arc-panel[hidden] {
        display: none;
    }
    .call-arc-placeholder {
        padding: 2.5rem 1rem;
        text-align: center;
        color: #666;
    }
    .call-arc-sheet__body {
        padding: 0;
        overflow: auto;
        max-height: calc(100vh - 10.5rem);
    }
    .call-arc-table {

    .call-arc-table th,

    .call-arc-table .nums th {

    }

    .call-arc-table .len-mark {

    .call-arc-table .fixed {

    }
    .call-arc-table td.edit {
        background: #fffde7;
        padding: 0;

    .call-arc-table select,

        border: 0;
        background: transparent;
        font-size: 13px;
        font-weight: 700;
        padding: 0.18rem 0.1rem;

        text-align: center;

const CALL_ARC_OPTIONS = {
    type_code: ['A', 'W'],
    water_cooler: ['1', '0'],
    coolant: ['1', '0'],
    trolley: ['1', '0'],
    feeder: ['4', '4S'],
    hose: ['2', '5', '10', '15', '20'],
    torch: ['0', '4'],
    ground: ['0', '3', '5']
};

function callArcOptions(name) {
    const sheetOptions = CALL_ARC_SHEETS[activeCallArcSheet][name];
    if (sheetOptions) {
        return sheetOptions;
    }
    return CALL_ARC_OPTIONS[name];
}

document.getElementById('callArcTabs').addEventListener('click', function (event) {
    const button = event.target.closest('[data-tab]');
    if (!button) return;
    const tab = button.getAttribute('data-tab');
    document.querySelectorAll('#callArcTabs [data-tab]').forEach(function (item) {
        item.classList.toggle('is-active', item === button);
    });
    const sheetPanel = document.querySelector('[data-tab-panel="sheet"]');
    const isSheet = !!CALL_ARC_SHEETS[tab];
    sheetPanel.hidden = !isSheet;
    document.querySelectorAll('.call-arc-panel[data-tab-panel]').forEach(function (panel) {
        panel.hidden = panel.getAttribute('data-tab-panel') !== tab;
    });
    document.getElementById('addCallArcRowBtn').hidden = !isSheet;
    if (!isSheet) return;
    activeCallArcSheet = tab;
    applySheetChrome();
    loadRows().then(pinCallArcHeader);
});

function sheetSpec() {
    return CALL_ARC_SHEETS[activeCallArcSheet];
}

function sheetColspan() {
    return sheetSpec().columns.length + 2;
}

function applySheetChrome() {
    const spec = sheetSpec();
    const table = document.getElementById('callArcTable');
    const cols = ['<col style="width:' + spec.sapWidth + '">'];
    spec.columns.forEach(function (column) {
        cols.push('<col style="width:' + column.width + '">');
    });
    cols.push('<col style="width:' + spec.actionWidth + '">');
    table.querySelector('colgroup').innerHTML = cols.join('');
    const nums = spec.columns.map(function (column) {
        return '<th' + (column.kind === 'prefix' ? ' id="callArcPrefixHead"' : '') + '>' + column.num + '</th>';
    }).join('');
    const labels = spec.columns.map(function (column) {
        if (column.kind === 'prefix') return '<th>' + (spec.prefixLabel || spec.prefix) + '</th>';
        if (column.kind === 'code') return '<th class="len-mark">' + spec.targetLength + '자</th>';
        return '<th>' + column.label + '</th>';
    }).join('');
    table.querySelector('thead').innerHTML =
        '<tr class="series"><th colspan="' + sheetColspan() + '" id="callArcSeries">' + spec.series + '</th></tr>'
        + '<tr class="nums"><th rowspan="2" class="gap-head">SAP코드</th>' + nums + '<th rowspan="2"></th></tr>'
        + '<tr class="labels">' + labels + '</tr>';
}

function callArcSelect(name, value) {
    const options = callArcOptions(name).map(function (item) {
        const selected = String(item) === String(value) ? ' selected' : '';
        return '<option value="' + item + '"' + selected + '>' + item + '</option>';
    }).join('');
    return '<select data-field="' + name + '" disabled>' + options + '</select>';
}

function setRowEditing(tr, editing) {
    tr.querySelectorAll('[data-field]').forEach(function (el) {
        el.disabled = !editing;
    });
    const button = tr.querySelector('[data-edit]');
    if (!button) return;
    button.textContent = editing ? '저장' : '수정';
    button.classList.toggle('btn-outline-secondary', !editing);
    button.classList.toggle('btn-outline-success', editing);
}

function buildCodeName(row) {
    const spec = sheetSpec();
    if (spec.layout === 's') {
        return spec.prefix + row.capacity
            + ',' + row.type_code
            + ',HO' + (row.holder || '')
            + ',E' + row.ground
            + '_' + (row.call_arc_code || '');
    }
    const head = spec.prefix + row.capacity
        + ',' + row.type_code + row.water_cooler + row.coolant + row.trolley;
    if (spec.layout === 'c') {
        return head
            + ',T' + row.torch
            + ',E' + row.ground
            + ',G' + (row.gas || '')
            + '_' + (row.call_arc_code || '');
    }
    return head
        + ',WF' + row.feeder
        + ',H' + row.hose
        + ',T' + row.torch
        + ',E' + row.ground
        + '_' + (row.call_arc_code || '');
}

function readRow(tr) {
    const data = { id: Number(tr.getAttribute('data-id')) };
    tr.querySelectorAll('[data-field]').forEach(function (el) {
        data[el.getAttribute('data-field')] = el.value;
    });
    return data;
}

function paintCodeName(cell, codeName) {
    cell.textContent = codeName;
    cell.className = codeName.length === sheetSpec().targetLength ? 'code-name is-target' : 'code-name';
}

function renderRows(rows) {
    const body = document.getElementById('callArcBody');
    const spec = sheetSpec();
    if (!rows.length) {
        body.innerHTML = '<tr><td colspan="' + sheetColspan() + '" class="call-arc-empty">등록된 코드가 없습니다. 행 추가로 채번합니다.</td></tr>';
        return;
    }
    body.innerHTML = rows.map(function (row) {
        const codeName = row.code_name || buildCodeName(row);
        const lengthClass = codeName.length === spec.targetLength ? 'code-name is-target' : 'code-name';
        const cells = spec.columns.map(function (column) {
            if (column.kind === 'prefix') return '<td class="fixed">' + spec.prefix + '</td>';
            if (column.kind === 'select') return '<td class="edit">' + callArcSelect(column.field, row[column.field]) + '</td>';
            if (column.kind === 'fixed') return '<td class="fixed">' + column.text + '</td>';
            if (column.kind === 'input') {
                return '<td class="edit"><input class="call-arc-input" data-field="call_arc_code" value="'
                    + (row.call_arc_code || '').replace(/"/g, '&quot;') + '" maxlength="40" disabled></td>';
            }
            return '<td class="' + lengthClass + '" data-code-name>' + codeName + '</td>';
        }).join('');
        return '<tr data-id="' + row.id + '"><td class="gap">' + row.gap_code + '</td>' + cells
            + '<td class="row-actions"><button type="button" class="btn btn-sm btn-outline-secondary" data-edit>수정</button><button type="button" class="btn btn-sm btn-outline-danger" data-delete>삭제</button></td></tr>';
    }).join('');
}

function readApi(res) {
    return res.text().then(function (text) {
        let data = null;
        try {
            data = text ? JSON.parse(text) : null;
        } catch (e) {
            throw new Error('서버 응답을 해석하지 못했습니다. (' + res.status + ')');
        }
        if (!res.ok || !data || !data.success) {
            throw new Error((data && data.error) || ('요청 실패 (' + res.status + ')'));
        }
        return data;
    });
}

function pinCallArcHeader() {
    const series = document.querySelector('.call-arc-table .series');
    const nums = document.querySelector('.call-arc-table .nums');
    if (!series || !nums) return;
    const seriesHeight = series.getBoundingClientRect().height;
    const numsCell = nums.querySelector('th:not(.gap-head)') || nums;
    const numsHeight = numsCell.getBoundingClientRect().height;
    nums.querySelectorAll('th').forEach(function (cell) {
        cell.style.top = seriesHeight + 'px';
    });
    document.querySelectorAll('.call-arc-table .labels th').forEach(function (cell) {
        cell.style.top = (seriesHeight + numsHeight) + 'px';
    });
}

function loadRows() {
    return fetch('/api/call_arc_codes?sheet=' + encodeURIComponent(activeCallArcSheet), { credentials: 'same-origin' })
        .then(readApi)
        .then(function (data) {
            renderRows(data.rows || []);
        })
        .catch(function (err) {
            document.getElementById('callArcBody').innerHTML =
                '<tr><td colspan="' + sheetColspan() + '" class="call-arc-empty">' + err.message + '</td></tr>';
        });
}

document.getElementById('callArcBody').addEventListener('change', function (event) {
    const tr = event.target.closest('tr[data-id]');
    if (!tr || event.target.disabled) return;
    const cell = tr.querySelector('[data-code-name]');
    paintCodeName(cell, buildCodeName(readRow(tr)));
});

document.getElementById('callArcBody').addEventListener('click', function (event) {
    const editButton = event.target.closest('[data-edit]');
    if (editButton) {
        const tr = editButton.closest('tr[data-id]');
        if (!tr) return;
        if (editButton.textContent !== '저장') {
            setRowEditing(tr, true);
            return;
        }
        const payload = readRow(tr);
        const cell = tr.querySelector('[data-code-name]');
        editButton.disabled = true;
        fetch('/api/call_arc_codes/' + payload.id, {
            method: 'PUT',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(readApi).then(function (data) {
            paintCodeName(cell, data.row.code_name);
            setRowEditing(tr, false);
        }).catch(function (err) {
            alert(err.message || '수정 실패');
        }).then(function () {
            editButton.disabled = false;
        });
        return;
    }

    const button = event.target.closest('[data-delete]');
    if (!button) return;
    const tr = button.closest('tr[data-id]');
    if (!tr || !confirm('이 행을 삭제할까요?')) return;
    fetch('/api/call_arc_codes/' + tr.getAttribute('data-id'), {
        method: 'DELETE',
        credentials: 'same-origin'
    }).then(readApi).then(function () {
        loadRows();
    }).catch(function (err) {
        alert(err.message || '삭제 실패');
    });
});

document.getElementById('addCallArcRowBtn').addEventListener('click', function () {
    const button = document.getElementById('addCallArcRowBtn');
    button.disabled = true;
    fetch('/api/call_arc_codes', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sheet: activeCallArcSheet })
    }).then(readApi).then(function () {
        return loadRows();
    }).catch(function (err) {
        alert(err.message || '행 추가 실패');
    }).then(function () {
        button.disabled = false;
    });
});

loadRows().then(pinCallArcHeader);
window.addEventListener('resize', pinCallArcHeader);
</script>
{% endblock %}
