{% extends "base.html" %}

{% block title %}파트가격조회 대시보드 - 웰딩 장비 옵션 시스템{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center">
                <h2 style="color: #000000 !important;">
                    파트가격조회 대시보드
                </h2>
            </div>
        </div>
    </div>

    <!-- 통계 카드 섹션 -->
    <div class="row mb-4">
        <div class="col-md-4 mb-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <i class="fas fa-box fa-2x text-primary mb-2"></i>
                    <h5 class="card-title">총 부품 수</h5>
                    <h2 class="text-primary" id="totalPartsCount">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <i class="fas fa-euro-sign fa-2x text-success mb-2"></i>
                    <h5 class="card-title">총 가격</h5>
                    <h2 class="text-success" id="totalPrice">€ 0.00</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card text-center h-100">
                <div class="card-body">
                    <i class="fas fa-calculator fa-2x text-info mb-2"></i>
                    <h5 class="card-title">평균 가격</h5>
                    <h2 class="text-info" id="averagePrice">€ 0.00</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- 필터 및 검색 섹션 -->
    <div class="row mb-3">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">자재코드 또는 설명 검색</label>
                            <input type="text" class="form-control" id="searchInput" placeholder="검색어를 입력하세요..." onkeyup="handleSearch()">
                        </div>
                        <div class="col-md-6 d-flex align-items-end">
                            <button class="btn btn-success me-2" onclick="openAddPartModal()">
                                <i class="fas fa-plus me-2"></i>자재코드 추가
                            </button>
                            <button class="btn btn-primary me-2" onclick="loadParts()">
                                <i class="fas fa-sync-alt me-2"></i>새로고침
                            </button>
                            <button class="btn btn-secondary me-2" id="exportExcelBtn" onclick="exportToExcel()">
                                <i class="fas fa-file-excel me-2"></i>엑셀 다운로드
                            </button>
                            <button class="btn btn-danger" id="bulkDeleteBtn" onclick="bulkDeleteParts()" disabled>
                                <i class="fas fa-trash me-2"></i>선택 삭제
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 부품 목록 테이블 -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header bg-burgundy" style="background-color: #800020 !important;">
                    <h5 class="mb-0" style="color: #ffffff !important;">
                        <i class="fas fa-list me-2"></i>
                        부품 목록
                    </h5>
                </div>
                <div class="card-body">
                    <div id="loadingMessage" class="text-center py-4" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">로딩 중...</span>
                        </div>
                        <p class="mt-2">데이터를 불러오는 중...</p>
                    </div>
                    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover" id="partsTable">
                            <thead>
                                <tr>
                                    <th class="text-center" style="width: 50px;">
                                        <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
                                    </th>
                                    <th style="white-space: nowrap;">번호</th>
                                    <th style="white-space: nowrap;">자재코드</th>
                                    <th style="white-space: nowrap;">설명</th>
                                    <th class="text-end" style="white-space: nowrap;">가격(EUR)</th>
                                    <th style="white-space: nowrap;">등록일</th>
                                    <th style="white-space: nowrap;">수정일</th>
                                    <th class="text-center" style="width: 100px;">편집</th>
                                    <th class="text-center" style="width: 100px;">삭제</th>
                                </tr>
                            </thead>
                            <tbody id="partsTableBody">
                                <tr>
                                    <td colspan="9" class="text-center">데이터를 불러오는 중...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 자재코드 추가 모달 -->
<div class="modal fade" id="addPartModal" tabindex="-1" aria-labelledby="addPartModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success" style="background-color: #28a745 !important;">
                <h5 class="modal-title" id="addPartModalLabel" style="color: #ffffff !important;">
                    <i class="fas fa-plus me-2"></i>자재코드 추가
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addPartForm">
                    <div class="mb-3">
                        <label class="form-label"><strong>자재코드 <span class="text-danger">*</span></strong></label>
                        <input type="text" class="form-control" id="addMaterialCode" required>
                        <small class="form-text text-muted">자재코드를 입력하세요.</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>설명 <span class="text-danger">*</span></strong></label>
                        <input type="text" class="form-control" id="addDescription" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>가격 (EUR) <span class="text-danger">*</span></strong></label>
                        <input type="number" class="form-control" id="addPrice" step="0.01" min="0" required>
                    </div>
                    <div id="addPartError" class="alert alert-danger" style="display: none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-success" id="saveAddPartBtn" onclick="saveAddPart()">
                    <i class="fas fa-save me-2"></i>추가
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 편집 모달 -->
<div class="modal fade" id="editPartModal" tabindex="-1" aria-labelledby="editPartModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-burgundy" style="background-color: #800020 !important;">
                <h5 class="modal-title" id="editPartModalLabel" style="color: #ffffff !important;">
                    <i class="fas fa-edit me-2"></i>부품 정보 편집
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editPartForm">
                    <input type="hidden" id="editPartId">
                    <div class="mb-3">
                        <label class="form-label"><strong>자재코드</strong></label>
                        <input type="text" class="form-control" id="editMaterialCode" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>설명 <span class="text-danger">*</span></strong></label>
                        <input type="text" class="form-control" id="editDescription" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><strong>가격 (EUR) <span class="text-danger">*</span></strong></label>
                        <input type="number" class="form-control" id="editPrice" step="0.01" min="0" required>
                    </div>
                    <div id="editPartError" class="alert alert-danger" style="display: none;"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" id="saveEditPartBtn" onclick="saveEditPart()">
                    <i class="fas fa-save me-2"></i>저장
                </button>
            </div>
        </div>
    </div>
</div>

<script>
let allParts = [];
let filteredParts = [];

document.addEventListener('DOMContentLoaded', function() {
    loadParts();
    
    // 편집 모달이 닫힐 때 버튼 상태 초기화
    const editPartModal = document.getElementById('editPartModal');
    if (editPartModal) {
        editPartModal.addEventListener('hidden.bs.modal', function() {
            const saveButton = document.getElementById('saveEditPartBtn');
            if (saveButton) {
                saveButton.disabled = false;
                saveButton.innerHTML = '<i class="fas fa-save me-2"></i>저장';
            }
            // 에러 메시지도 초기화
            const errorDiv = document.getElementById('editPartError');
            if (errorDiv) {
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
            }
        });
    }
});

function loadParts() {
    const loadingMessage = document.getElementById('loadingMessage');
    const errorMessage = document.getElementById('errorMessage');
    const tableBody = document.getElementById('partsTableBody');
    
    loadingMessage.style.display = 'block';
    errorMessage.style.display = 'none';
    tableBody.innerHTML = '<tr><td colspan="9" class="text-center">데이터를 불러오는 중...</td></tr>';
    
    fetch('/api/part_price/dashboard')
        .then(response => response.json())
        .then(data => {
            loadingMessage.style.display = 'none';
            
            if (data.success) {
                allParts = data.parts || [];
                filteredParts = [...allParts];
                
                // 통계 업데이트
                updateStatistics(data.statistics);
                
                // 테이블 업데이트
                renderTable();
            } else {
                errorMessage.textContent = data.error || '데이터를 불러오는 중 오류가 발생했습니다.';
                errorMessage.style.display = 'block';
            }
        })
        .catch(error => {
            loadingMessage.style.display = 'none';
            errorMessage.textContent = '데이터를 불러오는 중 오류가 발생했습니다: ' + error.message;
            errorMessage.style.display = 'block';
            console.error('Error loading parts:', error);
        });
}

function updateStatistics(statistics) {
    document.getElementById('totalPartsCount').textContent = statistics.totalParts || 0;
    document.getElementById('totalPrice').textContent = '€ ' + (statistics.totalPrice || 0).toFixed(2);
    document.getElementById('averagePrice').textContent = '€ ' + (statistics.averagePrice || 0).toFixed(2);
}

function renderTable() {
    const tableBody = document.getElementById('partsTableBody');
    
    if (filteredParts.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="9" class="text-center">데이터가 없습니다.</td></tr>';
        updateBulkDeleteButton();
        return;
    }
    
    let html = '';
    filteredParts.forEach((part, index) => {
        html += `
            <tr>
                <td class="text-center">
                    <input type="checkbox" class="part-checkbox" 
                           data-part-id="${part.id}"
                           data-material-code="${(part.material_code || '').replace(/"/g, '&quot;')}"
                           data-description="${(part.description || '').replace(/"/g, '&quot;')}"
                           onchange="updateBulkDeleteButton()">
                </td>
                <td>${index + 1}</td>
                <td><strong>${part.material_code || ''}</strong></td>
                <td>${part.description || ''}</td>
                <td class="text-end">€ ${(part.price || 0).toFixed(2)}</td>
                <td>${part.created_at ? new Date(part.created_at).toLocaleDateString('ko-KR') : '-'}</td>
                <td>${part.updated_at ? new Date(part.updated_at).toLocaleDateString('ko-KR') : '-'}</td>
                <td class="text-center">
                    <button class="btn btn-sm btn-primary edit-btn" 
                            data-part-id="${part.id}"
                            data-material-code="${(part.material_code || '').replace(/"/g, '&quot;')}"
                            data-description="${(part.description || '').replace(/"/g, '&quot;')}"
                            data-price="${part.price || 0}"
                            title="편집">
                        <i class="fas fa-edit"></i>
                    </button>
                </td>
                <td class="text-center">
                    <button class="btn btn-sm btn-danger delete-btn" 
                            data-part-id="${part.id}"
                            data-material-code="${(part.material_code || '').replace(/"/g, '&quot;')}"
                            data-description="${(part.description || '').replace(/"/g, '&quot;')}"
                            title="삭제">
                        <i class="fas fa-trash"></i>
                    </button>
                </td>
            </tr>
        `;
    });
    
    tableBody.innerHTML = html;
    updateBulkDeleteButton();
    
    // 편집 버튼 이벤트 리스너 추가
    document.querySelectorAll('.edit-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const partId = this.getAttribute('data-part-id');
            const materialCode = this.getAttribute('data-material-code');
            const description = this.getAttribute('data-description');
            const price = parseFloat(this.getAttribute('data-price')) || 0;
            openEditPartModal(partId, materialCode, description, price);
        });
    });
    
    // 삭제 버튼 이벤트 리스너 추가
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const partId = this.getAttribute('data-part-id');
            const materialCode = this.getAttribute('data-material-code');
            const description = this.getAttribute('data-description');
            deletePart(partId, materialCode, description);
        });
    });
}

function handleSearch() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
    
    if (!searchTerm) {
        filteredParts = [...allParts];
    } else {
        filteredParts = allParts.filter(part => {
            const materialCode = (part.material_code || '').toLowerCase();
            const description = (part.description || '').toLowerCase();
            return materialCode.includes(searchTerm) || description.includes(searchTerm);
        });
    }
    
    renderTable();
}

// 전체 선택/해제
function toggleSelectAll(checkbox) {
    const checkboxes = document.querySelectorAll('.part-checkbox');
    checkboxes.forEach(cb => {
        cb.checked = checkbox.checked;
    });
    updateBulkDeleteButton();
}

// 선택 삭제 버튼 상태 업데이트
function updateBulkDeleteButton() {
    const checkedBoxes = document.querySelectorAll('.part-checkbox:checked');
    const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
    if (bulkDeleteBtn) {
        bulkDeleteBtn.disabled = checkedBoxes.length === 0;
    }
}

// 선택 삭제
function bulkDeleteParts() {
    const checkedBoxes = document.querySelectorAll('.part-checkbox:checked');
    if (checkedBoxes.length === 0) {
        alert('삭제할 항목을 선택해주세요.');
        return;
    }
    
    const parts = Array.from(checkedBoxes).map(cb => ({
        id: cb.getAttribute('data-part-id'),
        materialCode: cb.getAttribute('data-material-code'),
        description: cb.getAttribute('data-description')
    }));
    
    const partList = parts.map(p => `- ${p.materialCode}: ${p.description}`).join('\n');
    if (!confirm(`선택한 ${parts.length}개의 부품을 삭제하시겠습니까?\n\n${partList}`)) {
        return;
    }
    
    const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
    const originalText = bulkDeleteBtn.innerHTML;
    bulkDeleteBtn.disabled = true;
    bulkDeleteBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>삭제 중...';
    
    const partIds = parts.map(p => parseInt(p.id));
    
    fetch('/api/part_price/bulk_delete', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify({ part_ids: partIds })
    })
    .then(response => {
        console.log('일괄 삭제 응답 상태:', response.status, response.statusText);
        
        const contentType = response.headers.get('content-type') || '';
        
        // Content-Type 확인
        if (!contentType.includes('application/json')) {
            return response.text().then(text => {
                console.error('JSON이 아닌 응답:', text.substring(0, 1000));
                
                // HTML 오류 페이지인 경우
                if (text.trim().toLowerCase().startsWith('<!doctype') || text.trim().toLowerCase().startsWith('<html')) {
                    throw new Error('서버에서 HTML 오류 페이지를 반환했습니다. 서버를 재시작하거나 관리자에게 문의하세요.');
                }
                
                throw new Error('서버에서 JSON이 아닌 응답을 받았습니다: ' + text.substring(0, 200));
            });
        }
        
        // HTTP 오류 상태 코드 처리
        if (!response.ok) {
            return response.json().then(data => {
                throw new Error(data.error || `HTTP 오류 (${response.status}): ${response.statusText}`);
            }).catch(err => {
                if (err.message.includes('Unexpected token')) {
                    return response.text().then(text => {
                        throw new Error(`서버 오류 (${response.status}): HTML 응답을 받았습니다. 서버를 확인해주세요.`);
                    });
                }
                throw err;
            });
        }
        
        return response.json();
    })
    .then(data => {
        if (data.success) {
            alert(`${data.deleted_count}개의 부품이 삭제되었습니다.`);
            loadParts();
        } else {
            alert('삭제 중 오류가 발생했습니다: ' + (data.error || '알 수 없는 오류'));
            bulkDeleteBtn.disabled = false;
            bulkDeleteBtn.innerHTML = originalText;
        }
    })
    .catch(error => {
        console.error('일괄 삭제 오류:', error);
        alert('삭제 중 오류가 발생했습니다: ' + error.message);
        bulkDeleteBtn.disabled = false;
        bulkDeleteBtn.innerHTML = originalText;
    });
}

// 자재코드 추가 모달 열기
function openAddPartModal() {
    document.getElementById('addMaterialCode').value = '';
    document.getElementById('addDescription').value = '';
    document.getElementById('addPrice').value = '';
    document.getElementById('addPartError').style.display = 'none';
    document.getElementById('addPartError').textContent = '';
    
    const modalElement = document.getElementById('addPartModal');
    let modal = bootstrap.Modal.getInstance(modalElement);
    if (!modal) {
        modal = new bootstrap.Modal(modalElement);
    }
    modal.show();
}

// 자재코드 추가 저장
function saveAddPart() {
    const materialCode = document.getElementById('addMaterialCode').value.trim();
    const description = document.getElementById('addDescription').value.trim();
    const price = parseFloat(document.getElementById('addPrice').value);
    const errorDiv = document.getElementById('addPartError');
    
    if (!materialCode) {
        errorDiv.textContent = '자재코드를 입력해주세요.';
        errorDiv.style.display = 'block';
        return;
    }
    
    if (!description) {
        errorDiv.textContent = '설명을 입력해주세요.';
        errorDiv.style.display = 'block';
        return;
    }
    
    if (isNaN(price) || price < 0) {
        errorDiv.textContent = '가격을 올바르게 입력해주세요.';
        errorDiv.style.display = 'block';
        return;
    }
    
    errorDiv.style.display = 'none';
    
    const saveButton = document.getElementById('saveAddPartBtn');
    const originalText = saveButton.innerHTML;
    saveButton.disabled = true;
    saveButton.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>추가 중...';
    
    fetch('/api/part_price/add', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify({
            material_code: materialCode,
            description: description,
            price: price
        })
    })
    .then(response => {
        console.log('응답 상태:', response.status, response.statusText);
        console.log('응답 헤더:', Object.fromEntries(response.headers.entries()));
        
        const contentType = response.headers.get('content-type') || '';
        console.log('Content-Type:', contentType);
        
        // Content-Type 확인
        if (!contentType.includes('application/json')) {
            return response.text().then(text => {
                console.error('JSON이 아닌 응답 (처음 1000자):', text.substring(0, 1000));
                
                // HTML 오류 페이지인 경우
                if (text.trim().toLowerCase().startsWith('<!doctype') || text.trim().toLowerCase().startsWith('<html')) {
                    throw new Error('서버에서 HTML 오류 페이지를 반환했습니다. 서버를 재시작하거나 관리자에게 문의하세요.');
                }
                
                throw new Error('서버에서 JSON이 아닌 응답을 받았습니다: ' + text.substring(0, 200));
            });
        }
        
        // HTTP 오류 상태 코드 처리
        if (!response.ok) {
            return response.json().then(data => {
                throw new Error(data.error || `HTTP 오류 (${response.status}): ${response.statusText}`);
            }).catch(err => {
                // JSON 파싱 실패 시
                if (err.message.includes('Unexpected token')) {
                    return response.text().then(text => {
                        throw new Error(`서버 오류 (${response.status}): HTML 응답을 받았습니다. 서버를 확인해주세요.`);
                    });
                }
                throw err;
            });
        }
        
        return response.json();
    })
    .then(data => {
        if (data.success) {
            const modalElement = document.getElementById('addPartModal');
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) {
                modal.hide();
            }
            loadParts();
        } else {
            errorDiv.textContent = data.error || '추가 중 오류가 발생했습니다.';
            errorDiv.style.display = 'block';
            saveButton.disabled = false;
            saveButton.innerHTML = originalText;
        }
    })
    .catch(error => {
        console.error('자재코드 추가 오류:', error);
        errorDiv.textContent = '추가 중 오류가 발생했습니다: ' + error.message;
        errorDiv.style.display = 'block';
        saveButton.disabled = false;
        saveButton.innerHTML = originalText;
    });
}

// 편집 모달 열기
function openEditPartModal(partId, materialCode, description, price) {
    document.getElementById('editPartId').value = partId;
    document.getElementById('editMaterialCode').value = materialCode || '';
    document.getElementById('editDescription').value = description || '';
    document.getElementById('editPrice').value = price || 0;
    document.getElementById('editPartError').style.display = 'none';
    document.getElementById('editPartError').textContent = '';
    
    // 저장 버튼 상태 초기화
    const saveButton = document.getElementById('saveEditPartBtn');
    if (saveButton) {
        saveButton.disabled = false;
        saveButton.innerHTML = '<i class="fas fa-save me-2"></i>저장';
    }
    
    const modalElement = document.getElementById('editPartModal');
    let modal = bootstrap.Modal.getInstance(modalElement);
    if (!modal) {
        modal = new bootstrap.Modal(modalElement);
    }
    modal.show();
}

// 편집 저장
function saveEditPart() {
    const partId = document.getElementById('editPartId').value;
    const materialCode = document.getElementById('editMaterialCode').value;
    const description = document.getElementById('editDescription').value.trim();
    const price = parseFloat(document.getElementById('editPrice').value);
    const errorDiv = document.getElementById('editPartError');
    
    if (!description) {
        errorDiv.textContent = '설명을 입력해주세요.';
        errorDiv.style.display = 'block';
        return;
    }
    
    if (isNaN(price) || price < 0) {
        errorDiv.textContent = '가격을 올바르게 입력해주세요.';
        errorDiv.style.display = 'block';
        return;
    }
    
    errorDiv.style.display = 'none';
    
    const saveButton = document.getElementById('saveEditPartBtn');
    const originalText = saveButton.innerHTML;
    saveButton.disabled = true;
    saveButton.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>저장 중...';
    
    fetch('/api/part_price/update', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            id: parseInt(partId),
            material_code: materialCode,
            description: description,
            price: price
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // 저장 버튼 상태 초기화
            saveButton.disabled = false;
            saveButton.innerHTML = originalText;
            
            const modalElement = document.getElementById('editPartModal');
            const modal = bootstrap.Modal.getInstance(modalElement);
            if (modal) {
                modal.hide();
            }
            loadParts();
        } else {
            errorDiv.textContent = data.error || '저장 중 오류가 발생했습니다.';
            errorDiv.style.display = 'block';
            saveButton.disabled = false;
            saveButton.innerHTML = originalText;
        }
    })
    .catch(error => {
        errorDiv.textContent = '저장 중 오류가 발생했습니다: ' + error.message;
        errorDiv.style.display = 'block';
        saveButton.disabled = false;
        saveButton.innerHTML = originalText;
    });
}

// 삭제
function deletePart(partId, materialCode, description) {
    if (!confirm(`부품을 삭제하시겠습니까?\n\n자재코드: ${materialCode}\n설명: ${description}`)) {
        return;
    }
    
    fetch('/api/part_price/delete', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify({ id: parseInt(partId) })
    })
    .then(response => {
        console.log('삭제 응답 상태:', response.status, response.statusText);
        console.log('응답 헤더:', Object.fromEntries(response.headers.entries()));
        
        const contentType = response.headers.get('content-type') || '';
        console.log('Content-Type:', contentType);
        
        // Content-Type 확인
        if (!contentType.includes('application/json')) {
            return response.text().then(text => {
                console.error('JSON이 아닌 응답 (처음 1000자):', text.substring(0, 1000));
                
                // HTML 오류 페이지인 경우
                if (text.trim().toLowerCase().startsWith('<!doctype') || text.trim().toLowerCase().startsWith('<html')) {
                    throw new Error('서버에서 HTML 오류 페이지를 반환했습니다. 서버를 재시작하거나 관리자에게 문의하세요.');
                }
                
                throw new Error('서버에서 JSON이 아닌 응답을 받았습니다: ' + text.substring(0, 200));
            });
        }
        
        // HTTP 오류 상태 코드 처리
        if (!response.ok) {
            return response.json().then(data => {
                throw new Error(data.error || `HTTP 오류 (${response.status}): ${response.statusText}`);
            }).catch(err => {
                // JSON 파싱 실패 시
                if (err.message.includes('Unexpected token')) {
                    return response.text().then(text => {
                        throw new Error(`서버 오류 (${response.status}): HTML 응답을 받았습니다. 서버를 확인해주세요.`);
                    });
                }
                throw err;
            });
        }
        
        return response.json();
    })
    .then(data => {
        if (data.success) {
            alert('부품이 삭제되었습니다.');
            loadParts();
        } else {
            alert('삭제 중 오류가 발생했습니다: ' + (data.error || '알 수 없는 오류'));
        }
    })
    .catch(error => {
        console.error('삭제 오류:', error);
        alert('삭제 중 오류가 발생했습니다: ' + error.message);
    });
}

// 엑셀 다운로드
function exportToExcel() {
    const exportBtn = document.getElementById('exportExcelBtn');
    if (!exportBtn) {
        alert('엑셀 다운로드 버튼을 찾을 수 없습니다.');
        return;
    }
    
    if (filteredParts.length === 0) {
        alert('다운로드할 데이터가 없습니다.');
        return;
    }
    
    const originalText = exportBtn.innerHTML;
    exportBtn.disabled = true;
    exportBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>다운로드 중...';
    
    const exportData = filteredParts.map((part, index) => {
        return {
            번호: index + 1,
            자재코드: part.material_code || '',
            설명: part.description || '',
            가격: part.price || 0
        };
    });
    
    fetch('/api/part_price/excel', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/json'
        },
        body: JSON.stringify({
            parts: exportData
        })
    })
    .then(response => {
        console.log('엑셀 다운로드 응답 상태:', response.status, response.statusText);
        console.log('응답 헤더:', Object.fromEntries(response.headers.entries()));
        
        const contentType = response.headers.get('content-type') || '';
        console.log('Content-Type:', contentType);
        
        // HTTP 오류 상태 코드 처리
        if (!response.ok) {
            // JSON 오류 응답인 경우
            if (contentType.includes('application/json')) {
                return response.json().then(data => {
                    throw new Error(data.error || `HTTP 오류 (${response.status}): ${response.statusText}`);
                });
            }
            // HTML 오류 페이지인 경우
            return response.text().then(text => {
                console.error('엑셀 다운로드 오류 응답:', text.substring(0, 1000));
                
                if (text.trim().toLowerCase().startsWith('<!doctype') || text.trim().toLowerCase().startsWith('<html')) {
                    throw new Error(`서버 오류 (${response.status}): HTML 오류 페이지를 받았습니다. 서버를 확인해주세요.`);
                }
                
                let errorMsg = `서버 오류 (${response.status})`;
                try {
                    const errorData = JSON.parse(text);
                    if (errorData.error) {
                        errorMsg += ': ' + errorData.error;
                    }
                } catch (e) {
                    errorMsg += ': ' + text.substring(0, 200);
                }
                throw new Error(errorMsg);
            });
        }
        
        // JSON 응답인 경우 (오류)
        if (contentType.includes('application/json')) {
            return response.json().then(data => {
                throw new Error(data.error || '서버 오류가 발생했습니다.');
            });
        }
        
        // 엑셀 파일 응답
        return response.blob();
    })
    .then(blob => {
        if (!blob || blob.size === 0) {
            throw new Error('다운로드할 파일이 비어있습니다.');
        }
        
        if (blob.size < 100) {
            return blob.text().then(text => {
                throw new Error('서버 오류: ' + text.substring(0, 200));
            });
        }
        
        const url = window.URL.createObjectURL(blob);
        const dateStr = new Date().toISOString().split('T')[0].replace(/-/g, '');
        const filename = `part_price_${dateStr}.xlsx`;
        
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        a.setAttribute('download', filename);
        
        document.body.appendChild(a);
        
        setTimeout(() => {
            a.focus();
            a.click();
            
            setTimeout(() => {
                window.URL.revokeObjectURL(url);
                if (document.body.contains(a)) {
                    document.body.removeChild(a);
                }
                
                exportBtn.disabled = false;
                exportBtn.innerHTML = originalText;
            }, 2000);
        }, 100);
    })
    .catch(error => {
        alert('엑셀 다운로드 중 오류가 발생했습니다.\n\n오류 내용: ' + error.message);
        if (exportBtn) {
            exportBtn.disabled = false;
            exportBtn.innerHTML = originalText;
        }
    });
}
</script>
